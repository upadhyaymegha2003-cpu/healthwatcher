// Top-level build file where you can add configuration options common to all sub-projects/modules.
// Toolchain: Android Gradle Plugin 8.5.2 + Gradle 8.7 (requires JDK 17 -- the JDK bundled with
// current Android Studio releases is fine). The previous AGP 3.6.2 / jcenter setup cannot run on
// the JDKs shipped with current Android Studio, so the toolchain was moved up minimally.
plugins {
    id 'com.android.application' version '8.5.2' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
