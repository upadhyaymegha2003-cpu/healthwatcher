plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.yo7a.healthwatcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.yo7a.healthwatcher"
        // TensorFlow Lite (LiteRT runtime) 2.14 requires API 21+. API 19 (Android 4.4) devices
        // are no longer supported; this is the only compatibility reduction made for ML.
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0-ml"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
        buildConfig false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        // Golden fixtures shared by the JVM unit tests and the instrumented parity test.
        androidTest.assets.srcDirs += ['src/test/resources']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'

    // On-device inference (TensorFlow Lite runtime, Java API). Models are loaded from assets/models/.
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
